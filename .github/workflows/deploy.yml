name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run